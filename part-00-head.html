  <script>
    /* Session-gated intro. Sets a session flag so the splash shows only once
       per browsing session; repeat visits add .no-splash before paint (no flash).
       Scroll is locked during the intro and released by main.js. If JS is off,
       none of this runs: the CSS auto-dismiss animation still clears the splash,
       and no scroll lock is ever applied. */
    (function () {
      var d = document.documentElement;
      d.classList.add("js");
      try {
        if (window.sessionStorage.getItem("fz_splash_seen") === "1") {
          d.classList.add("no-splash");
          return;
        }
        window.sessionStorage.setItem("fz_splash_seen", "1");
      } catch (e) { /* storage blocked: show the splash once, it still auto-dismisses */ }
      d.classList.add("splash-on");
    })();
  </script>
