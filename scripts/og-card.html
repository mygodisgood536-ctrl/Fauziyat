<!doctype html>
<!--
  Social share card (1200x630).

  Rendered by `npm run og` into assets/img/og-image.jpg. It reuses the site's
  own self-hosted fonts and palette so a shared link looks like the site
  rather than a bare portrait, and it is sized to the 1.91:1 that Open Graph and
  Twitter expect.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fbf8f3;
    color: #16202a;
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 468px;
    gap: 56px;
    align-items: end;
    width: 100%;
    height: 100%;
    padding: 68px 64px;
  }

  /* Warm wash behind the type, echoing the hero's radial. */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 100% at 92% 4%, rgba(207, 144, 104, 0.2), transparent 60%);
    pointer-events: none;
  }

  .body { position: relative; display: grid; gap: 0; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: #9a4f23;
  }
  .eyebrow::after {
    content: "";
    height: 1px;
    width: 74px;
    background: currentColor;
    opacity: 0.45;
  }

  h1 {
    margin: 26px 0 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 108px;
    line-height: 0.92;
    letter-spacing: -0.03em;
  }
  h1 span { display: block; }
  h1 .accent { color: #9a4f23; font-style: italic; }

  .role {
    margin: 30px 0 0;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #4c5a67;
  }
  .role::before {
    content: "";
    width: 40px;
    height: 1px;
    background: #b5642f;
  }

  .meta {
    margin: 34px 0 0;
    padding-top: 22px;
    border-top: 1px solid #e0d6c6;
    font-size: 19px;
    color: #6d7986;
  }

  .figure {
    position: relative;
    margin: 0;
    height: 494px;
  }
  .figure img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 22%;
    border-radius: 3px;
  }
  .figure::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(16, 24, 32, 0.08);
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="body">
      <p class="eyebrow">Entity SEO &middot; Digital Identity</p>
      <h1><span>Fauziyat</span><span class="accent">Folashade</span></h1>
      <p class="role">Search Engine Marketing Specialist</p>
      <p class="meta">Entity SEO &middot; Google Entity strategy &middot; Structured data &middot; Nigeria</p>
    </div>
    <figure class="figure">
      <img src="../assets/img/fauziyat-folashade-portrait.jpg" alt="">
    </figure>
  </div>
</body>
</html>
